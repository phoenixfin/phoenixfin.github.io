{% capture ornament %}<div class="ornament" aria-hidden="true"><span></span><img src="{{ site.url }}/assets/images/logo-mark.png" alt=""><span></span></div>{% endcapture %}

{% if page.title == "Home" %}
  <header class="header-home">
    <h1 class="title">{{ site.name | replace: 'Literacy', '<em>Literacy</em>' }}</h1>
    {{ ornament }}
    <p class="bio">{{ site.bio }}</p>
  </header>

{% else %}
  {% include nav.html %}
  <header class="header-other">
    <h1 class="title">{{ page.title }}</h1>
    {{ ornament }}
    {% if page.description %}<h2 class="description">{{ page.description }}</h2>{% endif %}
  </header>
{% endif %}
